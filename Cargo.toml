[workspace]
resolver = "2"
members = [
    "raydeon",
    "pyraydeon",
    "hatch-lab",
]

[workspace.dependencies]
raydeon = { path = "./raydeon", version = "0.2" }
pyrayeon = { path = "./pyraydeon", version = "0.1.0-alpha" }

bon = "3"
dot_vox = "5"
env_logger = "0.11"
euclid = "0.22"
float-cmp = "0.5"
proptest = "1"
pyo3 = "0.22"
rayon = "1.2"
snafu = "0.8"
nutype = "0.6"
numpy = "0.22"
svg = "0.18"
test-case = "3"
tracing = "0.1"
